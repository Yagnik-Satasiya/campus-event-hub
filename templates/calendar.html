{% extends 'base.html' %}
{% block content %}

<link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>

<div class="container py-5">
    <div class="text-center mb-5">
        <span class="badge bg-primary text-white rounded-pill px-3 py-2 mb-2 shadow-sm">
            <i class="bi bi-calendar3 me-1"></i> Interactive Schedule
        </span>
        <h2 class="fw-bolder text-dark">Campus Events <span class="text-primary">Calendar</span></h2>
    </div>

    <div class="card border-0 rounded-4 shadow-sm bg-white p-4 p-md-5">
        <div id='calendar'></div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            themeSystem: 'bootstrap5',
            events: '/api/events', // Fetches data from our new route
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,listMonth'
            },
            eventClick: function (info) {
                // If the user clicks an event on the calendar, take them to the participation page
                info.jsEvent.preventDefault();
                if (info.event.url) {
                    window.location.href = info.event.url;
                }
            }
        });
        calendar.render();
    });
</script>

{% endblock %}
