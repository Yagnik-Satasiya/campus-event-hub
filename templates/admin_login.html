{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 rounded-4 shadow-lg overflow-hidden">
            <!-- Decorative Header -->
            <div class="bg-dark bg-gradient p-4 text-center text-white">
                <div class="d-inline-flex align-items-center justify-content-center bg-white bg-opacity-10 rounded-circle mb-3 border border-secondary"
                    style="width: 60px; height: 60px;">
                    <i class="bi bi-shield-lock-fill fs-1 text-warning"></i>
                </div>
                <h3 class="fw-bold mb-1">Admin Portal</h3>
                <p class="mb-0 text-white-50">Secure access for administrators</p>
            </div>

            <div class="card-body p-4 p-md-5">
                <form method="POST">
                    <div class="mb-4">
                        <label class="form-label fw-medium text-secondary">
                            <i class="bi bi-envelope-fill me-1"></i> Admin Email
                        </label>
                        <input type="email" name="email"
                            class="form-control form-control-lg bg-light border-0 focus-ring focus-ring-dark"
                            placeholder="admin@campushub.edu" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-medium text-secondary">
                            <i class="bi bi-lock-fill me-1"></i> Admin Password
                        </label>
                        <input type="password" name="password"
                            class="form-control form-control-lg bg-light border-0 focus-ring focus-ring-dark"
                            placeholder="••••••••" required>
                    </div>

                    <button type="submit"
                        class="btn btn-dark btn-lg w-100 fw-bold rounded-pill shadow-sm mt-2 hover-lift">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Authenticate
                    </button>
                </form>

                <div class="text-center mt-4">
                    <a href="{{ url_for('login') }}" class="text-secondary small text-decoration-none hover-primary">
                        <i class="bi bi-arrow-left me-1"></i> Back to User Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
