{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5">
        <div class="card border-0 rounded-4 shadow-sm p-4 p-md-5 bg-white">
            <div class="text-center mb-4">
                <i class="bi bi-envelope-paper text-primary fs-1"></i>
                <h3 class="fw-bold mt-2">Reset Password</h3>
                <p class="text-secondary small">Enter your email address and we will send you a link to reset your
                    password.</p>
            </div>

            <form method="POST">
                <div class="mb-4">
                    <label class="form-label text-secondary fw-medium">Email Address</label>
                    <input type="email" name="email" class="form-control form-control-lg bg-light border-0" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold hover-lift shadow-sm">
                    Request Password Reset
                </button>
            </form>
            <div class="text-center mt-4">
                <a href="{{ url_for('login') }}" class="text-decoration-none text-secondary small"><i
                        class="bi bi-arrow-left"></i> Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
