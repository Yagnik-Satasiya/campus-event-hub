{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 rounded-4 shadow-lg overflow-hidden">
            <!-- Decorative Header -->
            <div class="bg-primary bg-gradient p-4 text-center text-white">
                <div class="d-inline-flex align-items-center justify-content-center bg-white bg-opacity-25 rounded-circle mb-3"
                    style="width: 60px; height: 60px;">
                    <i class="bi bi-box-arrow-in-right fs-1"></i>
                </div>
                <h3 class="fw-bold mb-1">Welcome Back</h3>
                <p class="mb-0 text-white-50">Login to your account to continue</p>
            </div>

            <div class="card-body p-4 p-md-5">
                <form method="POST">
                    <div class="mb-4">
                        <label class="form-label fw-medium text-secondary">
                            <i class="bi bi-envelope-fill me-1"></i> Email Address
                        </label>
                        <input type="email" name="email"
                            class="form-control form-control-lg bg-light border-0 focus-ring focus-ring-primary"
                            placeholder="name@example.com" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-medium text-secondary">
                            <i class="bi bi-lock-fill me-1"></i> Password
                        </label>
                        <div
                            class="input-group input-group-lg border-0 bg-light rounded-3 overflow-hidden focus-ring focus-ring-primary">
                            <input type="password" class="form-control border-0 bg-transparent shadow-none"
                                id="loginPassword" name="password" placeholder="Enter password" required>
                            <span class="input-group-text bg-transparent border-0 text-secondary"
                                onclick="toggleLoginPassword()" style="cursor:pointer;"
                                title="Toggle Password Visibility">
                                <i class="bi bi-eye" id="loginEyeIcon"></i>
                            </span>
                        </div>
                        <div class="text-end mt-2">
                            <a href="{{ url_for('reset_password_request') }}"
                                class="text-decoration-none small text-primary fw-medium">Forgot Password?</a>
                        </div>
                    </div>

                    <button class="btn btn-primary btn-lg w-100 fw-bold rounded-pill hover-lift shadow-sm mt-2 mb-4">
                        Login
                    </button>
                </form>

                <div class="text-center">
                    <p class="text-secondary small mb-0">
                        Don't have an account?
                        <a href="/register" class="fw-bold text-primary text-decoration-none hover-primary">Create one
                            now</a>
                    </p>
                    <div class="mt-3">
                        <a href="{{ url_for('admin_login') }}" class="small text-muted text-decoration-none"><i
                                class="bi bi-shield-lock me-1"></i> Admin Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleLoginPassword() {
        const password = document.getElementById("loginPassword");
        const eye = document.getElementById("loginEyeIcon");

        if (password.type === "password") {
            password.type = "text";
            eye.classList.replace("bi-eye", "bi-eye-slash");
        } else {
            password.type = "password";
            eye.classList.replace("bi-eye-slash", "bi-eye");
        }
    }
</script>
{% endblock %}
